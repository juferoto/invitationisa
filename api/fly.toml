# fly.toml app configuration file generated for invitationisa on 2026-09-21T22:34:13+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'invitationisa'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  ADDR = ':8080'
  COOKIE_SAMESITE = 'lax'
  DATABASE_DSN = 'file:/data/invitation.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)&_pragma=foreign_keys(1)'
  # Los medios viven en Cloudinary, no en el disco de la máquina: así el
  # video no sale por aquí y el tráfico de salida —la única parte variable de
  # la factura— se queda en casi cero. Las claves van en `fly secrets`.
  STORAGE_DRIVER = 'cloudinary'

# El volumen ya solo guarda la base de datos, que pesa unos cientos de KB.
# El tamaño mínimo de Fly es 1 GB y cuesta 0,15 USD al mes.
[[mounts]]
  source = 'datos'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
