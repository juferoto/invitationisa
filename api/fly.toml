# Configuración de despliegue en Fly.io.
#
# Una sola máquina a propósito: SQLite vive en un volumen que no se puede
# compartir entre instancias. Si algún día hace falta escalar, primero hay que
# mover la base a Postgres.

app = "invitationisa"
primary_region = "dfw" # Dallas: buena ruta hacia Colombia

[build]
dockerfile = "Dockerfile"

[env]
ADDR = ":8080"
# La base y los medios viven en el volumen, no en la imagen: el contenedor se
# reemplaza en cada despliegue y todo lo que esté fuera del volumen se pierde.
DATABASE_DSN = "file:/data/invitation.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)&_pragma=foreign_keys(1)"
STORAGE_DRIVER = "local"
STORAGE_LOCAL_DIR = "/data/media"
# El panel y la API quedan en dominios distintos, así que la cookie necesita
# SameSite=None. Con un dominio propio para ambos, cámbialo a "lax".
COOKIE_SAMESITE = "none"

[[mounts]]
source = "datos"
destination = "/data"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "suspend"
auto_start_machines = true
# Sin mínimo la máquina se apaga y la primera visita espera el arranque. Para
# una invitación que se abre desde WhatsApp, esa espera se nota.
min_machines_running = 1

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
